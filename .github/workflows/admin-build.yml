name: Admin Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/admin-nsg/**'
      - '.github/workflows/admin-build.yml'

permissions:
  contents: read

env:
  CI: 1
  NODE_ENV: production
  EXPO_NO_GIT_STATUS: 1

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: npm
          cache-dependency-path: apps/admin-nsg/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Admin dependencies cleanly
        working-directory: apps/admin-nsg
        run: |
          rm -rf node_modules
          npm cache verify
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Align Expo 53 dependencies
        working-directory: apps/admin-nsg
        run: npx expo install --fix --npm

      - name: Verify Expo dependency tree
        working-directory: apps/admin-nsg
        run: |
          node -e "const p=require('./package.json'); console.log(JSON.stringify({expo:p.dependencies.expo,react:p.dependencies.react,rn:p.dependencies['react-native']},null,2))"
          node -e "const p=require('expo-modules-core/package.json'); console.log('Installed expo-modules-core:',p.version,'main:',p.main); if(!p.main || p.main.endsWith('.ts')) process.exit(1)"
          npm ls expo expo-modules-core expo-modules-autolinking expo-constants react-native --depth=2

      - name: Generate Admin Android project
        working-directory: apps/admin-nsg
        run: npx expo prebuild --platform android --clean

      - name: Verify Admin Expo autolinking
        working-directory: apps/admin-nsg
        run: |
          set -euo pipefail
          SETTINGS="android/settings.gradle"
          ROOT_BUILD="android/build.gradle"
          APP_BUILD="android/app/build.gradle"

          test -f "$SETTINGS" || { echo 'ERROR: settings.gradle missing'; exit 1; }
          test -f "$ROOT_BUILD" || { echo 'ERROR: android/build.gradle missing'; exit 1; }
          test -f "$APP_BUILD" || { echo 'ERROR: android/app/build.gradle missing'; exit 1; }

          grep -q 'expo-autolinking-settings' "$SETTINGS" || { echo 'ERROR: Expo autolinking settings plugin missing'; cat "$SETTINGS"; exit 1; }
          grep -q 'expoAutolinking.useExpoModules' "$SETTINGS" || { echo 'ERROR: useExpoModules missing'; cat "$SETTINGS"; exit 1; }
          grep -q 'expo-root-project' "$ROOT_BUILD" || { echo 'ERROR: expo-root-project missing from root build.gradle'; cat "$ROOT_BUILD"; exit 1; }
          grep -q 'autolinkLibrariesWithApp()' "$APP_BUILD" || { echo 'ERROR: React Native autolinking hook missing'; cat "$APP_BUILD"; exit 1; }

          chmod +x android/gradlew
          ./android/gradlew --version
          echo 'Admin native project and Expo autolinking configuration verified.'

      - name: Build Admin APK
        working-directory: apps/admin-nsg/android
        run: ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify Admin APK
        working-directory: apps/admin-nsg
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: studybro-admin-nsg-debug-apk
          path: apps/admin-nsg/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
