name: Admin Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/admin-nsg/**'
      - '.github/workflows/admin-build.yml'

permissions:
  contents: read

env:
  CI: 1

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Admin dependencies
        working-directory: apps/admin-nsg
        run: npm install
      - name: Align Admin Expo dependencies
        working-directory: apps/admin-nsg
        env:
          CI: 1
        run: npx expo install --fix
      - name: Generate Admin Android project
        working-directory: apps/admin-nsg
        env:
          CI: 1
        run: npx expo prebuild --platform android --clean
      - name: Verify Admin Android project
        run: |
          test -f apps/admin-nsg/android/settings.gradle || test -f apps/admin-nsg/android/settings.gradle.kts
          test -f apps/admin-nsg/android/gradlew
          chmod +x apps/admin-nsg/android/gradlew
          echo 'Admin Android project verified'
      - name: Build Admin APK
        run: |
          cd apps/admin-nsg/android
          ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: studybro-admin-nsg-debug-apk
          path: apps/admin-nsg/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
