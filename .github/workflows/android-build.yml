name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-student:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/student/package.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Student dependencies
        working-directory: apps/student
        run: npm install
      - name: Generate Student Android project
        working-directory: apps/student
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Verify Student Gradle project
        working-directory: apps/student/android
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -x gradlew
          echo "Student Gradle project verified"
      - name: Build Student APK
        working-directory: apps/student/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload Student APK
        uses: actions/upload-artifact@v4
        with:
          name: studybro-student-debug-apk
          path: apps/student/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin-nsg/package.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Admin dependencies
        working-directory: apps/admin-nsg
        run: npm install
      - name: Generate Admin Android project
        working-directory: apps/admin-nsg
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Verify Admin Gradle project
        working-directory: apps/admin-nsg/android
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -x gradlew
          echo "Admin Gradle project verified"
      - name: Build Admin APK
        working-directory: apps/admin-nsg/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: studybro-admin-nsg-debug-apk
          path: apps/admin-nsg/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
