name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-student:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/student
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/student/package.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build Student APK
        run: ./android/gradlew assembleDebug --no-daemon
      - name: Upload Student APK
        uses: actions/upload-artifact@v4
        with:
          name: studybro-student-debug-apk
          path: apps/student/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-nsg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin-nsg/package.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build Admin APK
        run: ./android/gradlew assembleDebug --no-daemon
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: studybro-admin-nsg-debug-apk
          path: apps/admin-nsg/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
