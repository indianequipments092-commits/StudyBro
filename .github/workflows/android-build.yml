name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CI: 1

jobs:
  build-student:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Student dependencies
        working-directory: apps/student
        run: npm install
      - name: Generate Student Android project
        working-directory: apps/student
        env:
          CI: 1
        run: npx expo prebuild --platform android --clean
      - name: Verify Student Android project
        run: |
          test -f apps/student/android/settings.gradle || test -f apps/student/android/settings.gradle.kts
          test -f apps/student/android/gradlew
          chmod +x apps/student/android/gradlew
          echo 'Student Android project verified'
      - name: Build Student APK
        run: |
          cd apps/student/android
          ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Upload Student APK
        uses: actions/upload-artifact@v4
        with:
          name: studybro-student-debug-apk
          path: apps/student/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Admin dependencies
        working-directory: apps/admin-nsg
        run: npm install
      - name: Generate Admin Android project
        working-directory: apps/admin-nsg
        env:
          CI: 1
        run: npx expo prebuild --platform android --clean
      - name: Verify Admin Android project
        run: |
          test -f apps/admin-nsg/android/settings.gradle || test -f apps/admin-nsg/android/settings.gradle.kts
          test -f apps/admin-nsg/android/gradlew
          chmod +x apps/admin-nsg/android/gradlew
          echo 'Admin Android project verified'
      - name: Build Admin APK
        run: |
          cd apps/admin-nsg/android
          ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: studybro-admin-nsg-debug-apk
          path: apps/admin-nsg/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
