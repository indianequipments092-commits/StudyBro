name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-student:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/student
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/student/package.json
      - run: npm install
      - run: npx expo export --platform android

  build-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-nsg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin-nsg/package.json
      - run: npm install
      - run: npx expo export --platform android
