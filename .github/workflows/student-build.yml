name: Student Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/student/**'
      - '.github/workflows/student-build.yml'

permissions:
  contents: read

env:
  CI: 1

jobs:
  build-student:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Student dependencies
        working-directory: apps/student
        run: npm install
      - name: Align Student Expo dependencies
        working-directory: apps/student
        env:
          CI: 1
        run: |
          npx expo install --fix
          npx expo install expo-constants
      - name: Generate Student Android project
        working-directory: apps/student
        env:
          CI: 1
        run: npx expo prebuild --platform android --clean
      - name: Verify Student Expo autolinking
        run: |
          test -f apps/student/android/settings.gradle || test -f apps/student/android/settings.gradle.kts
          grep -q "expo-autolinking-settings" apps/student/android/settings.gradle || grep -q "expo-autolinking-settings" apps/student/android/settings.gradle.kts
          grep -q "expoAutolinking.useExpoModules" apps/student/android/settings.gradle || grep -q "expoAutolinking.useExpoModules" apps/student/android/settings.gradle.kts
          test -f apps/student/android/gradlew
          chmod +x apps/student/android/gradlew
          echo 'Student Android project and Expo autolinking verified'
      - name: Build Student APK
        run: |
          cd apps/student/android
          ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Upload Student APK
        uses: actions/upload-artifact@v4
        with:
          name: studybro-student-debug-apk
          path: apps/student/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
